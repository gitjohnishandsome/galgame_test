<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>我的文字冒險</title>
<script>/* 每次載入都帶時間戳，避免瀏覽器快取舊的樣式與程式 */document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="cg" class="layer"></div>
  <div id="sprites">
    <img id="spr-left" class="spr left" alt="">
    <img id="spr-center" class="spr center" alt="">
    <img id="spr-right" class="spr right" alt="">
  </div>

  <div id="pic"><img id="pic-img" alt=""></div>

  <div id="chapter-title"></div>

  <button data-act="mute" id="btn-mute">🔊 音樂 開</button>

  <div id="textbox">
    <div id="name"></div>
    <div id="text"></div>
    <div id="next-mark">▶▶</div>
  </div>

  <div id="menubar">
    <button data-act="history" title="歷史紀錄" aria-label="歷史紀錄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4z" fill="currentColor"/><path d="M8 8h8M8 12h5" stroke="#0b1026" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button data-act="skip" id="btn-skip" title="跳過已讀" aria-label="跳過已讀"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l8 7-8 7V5zM13 5l8 7-8 7V5z" fill="currentColor"/></svg></button>
    <button data-act="save" title="存檔" aria-label="存檔"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5V3z" fill="currentColor"/><path d="M8 3h7v5H8V3z" fill="#0b1026" opacity=".55"/><rect x="8" y="13" width="8" height="8" fill="#0b1026" opacity=".55"/></svg></button>
    <button data-act="load" title="讀檔" aria-label="讀檔"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3V6z" fill="currentColor"/><path d="M12 17v-6M9 14l3-3 3 3" stroke="#0b1026" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button data-act="settings" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M19.2 4.8l-2.1 2.1M6.9 17.1l-2.1 2.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button data-act="title" title="回標題畫面" aria-label="回標題畫面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8l4 4-4 4M19 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div id="choices"></div>

  <div id="banner"></div>

  <div id="title-screen" class="panel">
    <div id="title-tools">
      <p class="hint">存檔只存在這個瀏覽器裡，換裝置或清除瀏覽器資料前請先匯出。</p>
    </div>
    <div id="title-brand">
      <img id="game-logo" alt="" hidden>
      <img id="game-sublogo" alt="" hidden>
      <h1 id="game-title"></h1>
      <p id="game-subtitle"></p>
    </div>
    <div class="menu">
      <button data-act="new">開始遊戲</button>
      <button data-act="continue" id="btn-continue">繼續遊戲</button>
      <button data-act="load">讀取存檔</button>
      <button data-act="chapters">章節選擇</button>
      <button data-act="endings">結局列表</button>
      <button data-act="settings">遊戲設定</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
  </div>

  <div id="panel" class="panel hidden">
    <div id="panel-head"><span id="panel-title"></span><button data-act="closepanel">✕</button></div>
    <div id="panel-body"></div>
  </div>
</div>
<script>document.write('<script src="engine.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
