<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>場景編輯器</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
  <strong>場景編輯器</strong>
  <label>章節 <select id="chapter"></select></label>
  <button id="btn-save" title="Ctrl+S">儲存</button>
  <button id="btn-undo" title="Ctrl+Z">復原</button>
  <span class="sep"></span>
  <button id="btn-newch" title="新增一個章節檔">＋新增章節</button>
  <button id="btn-chs" title="調整章節順序與標題">章節管理</button>
  <span class="sep"></span>
  <button id="btn-play" title="從選取的這一句開始，用真正的遊戲試玩（含選項、轉場、音樂）">▶ 從這一句試玩</button>
  <button id="btn-outline" title="整章的段落與分支一覽">結構總覽</button>
  <span id="status"></span>
  <span class="grow"></span>
  <span class="hint">點左邊的一行 → 中間預覽那一句的畫面 → 點右邊的素材套用到這一句</span>
</header>

<main>
  <section id="col-script">
    <div class="col-title">劇情（點選一行，雙擊編輯文字）</div>
    <div id="toolbar">
      <button id="btn-edit" title="編輯選取的那一行（Enter 或 F2）">編輯</button>
      <button id="btn-add" title="在選取的那一行後面新增一句台詞">＋台詞</button>
      <button id="btn-del" title="刪除選取的那一行">刪除</button>
      <button id="btn-up" title="這一行往上移">↑</button>
      <button id="btn-down" title="這一行往下移">↓</button>
      <select id="add-cmd" title="插入選項、標籤、跳轉、旗標等流程指令">
        <option value="">＋流程…</option>
        <option value="choice">選項區塊（@choice）</option>
        <option value="label">標籤（*名稱）</option>
        <option value="jump">跳轉（@jump）</option>
        <option value="set">設定旗標（@set）</option>
        <option value="if">條件跳轉（@if）</option>
        <option value="ending">結局（@ending）</option>
        <option value="chapter">換章節（@chapter）</option>
      </select>
    </div>
    <div id="refbar"></div>
    <div id="lines"></div>
  </section>

  <section id="col-preview">
    <div id="pv-wrap"><iframe id="pv" title="預覽"></iframe></div>
    <div id="state">
      <div class="state-row"><b>目前這一句的畫面</b><span id="pv-line"></span></div>
      <div id="chips"></div>
      <div class="state-row">
        <b>立繪放置位置</b>
        <label><input type="radio" name="pos" value="left"> 左</label>
        <label><input type="radio" name="pos" value="center" checked> 中</label>
        <label><input type="radio" name="pos" value="right"> 右</label>
        <span class="muted">（點右邊立繪時套用到這個位置）</span>
      </div>
    </div>
  </section>

  <section id="col-assets">
    <div id="tabs"></div>
    <div id="assets"></div>
  </section>
</main>

<div id="play-modal" hidden>
  <div class="play-box">
    <div class="play-head">
      <strong id="play-title"></strong>
      <label>初始旗標 <input id="play-flags" type="text" placeholder="例如 trust=1, love=2（可留空）"></label>
      <button id="play-restart">⟲ 重新開始</button>
      <button id="play-close">關閉（Esc）</button>
    </div>
    <div id="play-end" class="muted"></div>
    <div id="play-wrap"><iframe id="play-frame" title="試玩" allow="autoplay"></iframe></div>
    <div class="muted">這是真正的遊戲：可以點選項、聽音樂、看轉場。試玩用的是目前編輯器裡的內容（<b>不用先存檔</b>），不會寫入任何存檔或結局記錄。</div>
  </div>
</div>

<div id="outline-modal" hidden>
  <div class="outline-box">
    <div class="play-head"><strong>劇情結構總覽</strong><span id="outline-info" class="muted"></span><span class="grow"></span><button id="outline-close">關閉（Esc）</button></div>
    <div class="legend">
      <span style="color:#d9a6ff">━ 選項</span><span style="color:#9aa6c0">━ 跳轉</span><span style="color:#ffb86b">┅ 條件</span><span style="color:#6b7690">┅ 自然接下去</span>
      <span style="color:#6fd6a0">▢ 綠框 = 有結局</span><span style="color:#ff9a9a">▢ 紅虛線 = 沒人跳到</span><span style="color:#7aa7ff">▢ 藍框 = 目前選取的段落</span>
    </div>
    <div id="outline-body"></div>
  </div>
</div>

<div id="edit-modal" hidden>
  <div class="box"></div>
</div>

<div id="modal" hidden>
  <div class="box">
    <h3>章節管理</h3>
    <p class="muted">調整章節順序（遊戲會依這個順序播放）與標題。這裡不能刪除章節。</p>
    <div id="ch-list"></div>
    <div class="btns"><button id="ch-save">儲存</button><button id="ch-cancel">取消</button></div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
