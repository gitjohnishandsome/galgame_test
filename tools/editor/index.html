<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>場景編輯器</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
  <strong>場景編輯器</strong>
  <label>章節 <select id="chapter"></select></label>
  <button id="btn-save" title="Ctrl+S">儲存</button>
  <button id="btn-undo" title="Ctrl+Z">復原</button>
  <span class="sep"></span>
  <button id="btn-newch" title="新增一個章節檔">＋新增章節</button>
  <button id="btn-chs" title="調整章節順序與標題">章節管理</button>
  <span id="status"></span>
  <span class="grow"></span>
  <span class="hint">點左邊的一行 → 中間預覽那一句的畫面 → 點右邊的素材套用到這一句</span>
</header>

<main>
  <section id="col-script">
    <div class="col-title">劇情（點選一行，雙擊編輯文字）</div>
    <div id="toolbar">
      <button id="btn-edit" title="編輯選取的那一行（Enter 或 F2）">編輯</button>
      <button id="btn-add" title="在選取的那一行後面新增一句台詞">＋台詞</button>
      <button id="btn-del" title="刪除選取的那一行">刪除</button>
      <button id="btn-up" title="這一行往上移">↑</button>
      <button id="btn-down" title="這一行往下移">↓</button>
    </div>
    <div id="lines"></div>
  </section>

  <section id="col-preview">
    <div id="pv-wrap"><iframe id="pv" title="預覽"></iframe></div>
    <div id="state">
      <div class="state-row"><b>目前這一句的畫面</b><span id="pv-line"></span></div>
      <div id="chips"></div>
      <div class="state-row">
        <b>立繪放置位置</b>
        <label><input type="radio" name="pos" value="left"> 左</label>
        <label><input type="radio" name="pos" value="center" checked> 中</label>
        <label><input type="radio" name="pos" value="right"> 右</label>
        <span class="muted">（點右邊立繪時套用到這個位置）</span>
      </div>
    </div>
  </section>

  <section id="col-assets">
    <div id="tabs"></div>
    <div id="assets"></div>
  </section>
</main>

<div id="edit-modal" hidden>
  <div class="box"></div>
</div>

<div id="modal" hidden>
  <div class="box">
    <h3>章節管理</h3>
    <p class="muted">調整章節順序（遊戲會依這個順序播放）與標題。這裡不能刪除章節。</p>
    <div id="ch-list"></div>
    <div class="btns"><button id="ch-save">儲存</button><button id="ch-cancel">取消</button></div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
